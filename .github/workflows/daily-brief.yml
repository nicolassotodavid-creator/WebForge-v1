name: Briefs en lote (manual, leads new → analyzed)

# Dispara la Edge Function cron-briefs para generar los briefs de los leads 'new' SIN depender
# del Mac. Es el PASO 1 del Orquestador movido a la nube (ver docs/superpowers/specs/
# 2026-07-03-brief-cron-servidor-design.md). El build en Lovable sigue en local (fase 2 aparte).
#
# 2026-09-13: SIN horario. Las webs están aparcadas y el cron gastaba Sonnet en cada lead que
# entraba (también en los de prospección del Home Estimator, que nunca van a tener web). El brief
# de un lead se genera con el botón «Generar brief» de su ficha; este workflow solo corre si se
# lanza a mano (Actions → Run workflow) y drena TODOS los 'new', así que mira antes cuántos hay.
#
# Auth con el secreto CRON_SECRET (secreto dedicado del cron, NO la service key). Está en:
#   - GitHub → Secrets and variables → Actions → CRON_SECRET
#   - Supabase (lo fija el workflow deploy.yml con `supabase secrets set`)

on:
  workflow_dispatch: {}

concurrency:
  group: cron-briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    steps:
      - name: Generar briefs (drena la cola de leads 'new')
        env:
          FUNCTION_URL: https://khscikqchvjxyvoaruas.supabase.co/functions/v1/cron-briefs
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repo (Settings → Secrets → Actions)."
            exit 1
          fi

          # Drenar la cola: llamar hasta que un tick no procese nada, con tope de seguridad.
          total=0
          for i in $(seq 1 40); do
            resp=$(curl -sS -X POST "$FUNCTION_URL" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 150)
            echo "tick $i → $resp"

            processed=$(echo "$resp" | jq -r '.processed // empty')
            if ! [[ "$processed" =~ ^[0-9]+$ ]]; then
              echo "::error::La función no autorizó o devolvió algo inesperado: $resp"
              exit 1
            fi

            total=$((total + processed))
            [ "$processed" -eq 0 ] && break
          done

          echo "Briefs generados en esta ejecución: $total"
