<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Neutro a propósito: es lo que ve el prospecto en la pestaña y en la vista previa al
         compartir el enlace de /book por WhatsApp. El panel pone su propio título (Layout.tsx). -->
    <meta name="theme-color" content="#fdfbf7" />
    <title>Tu nueva web · Nico Soto</title>
    <meta name="description" content="He preparado una web nueva para tu negocio. Échale un vistazo y, si te gusta, es tuya." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tu nueva web · Nico Soto" />
    <meta property="og:description" content="He preparado una web nueva para tu negocio. Échale un vistazo y, si te gusta, es tuya." />
    <meta property="og:locale" content="es_ES" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Tema dark-first del panel, aplicado antes de pintar (sin FOUC).
      // Las páginas públicas de cliente (/book, /gracias) se quedan en claro.
      (function () {
        try {
          var p = location.pathname;
          if (p.indexOf("/book") === 0 || p.indexOf("/gracias") === 0) return;
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : true;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
